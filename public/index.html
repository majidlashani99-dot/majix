<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Majix</title><style>body{margin:0;background:#0d1021;color:#fff;font-family:Tahoma}.app{max-width:480px;margin:auto;padding:18px 16px 80px}.top{display:flex;justify-content:space-between}.logo{font-size:28px;font-weight:bold;color:#8b7cff}.card{background:#191d38;border-radius:18px;padding:18px;margin:16px 0}.balance{font-size:36px;color:#ffd166;font-weight:bold}.muted{color:#a9aecb;font-size:13px}.task{display:flex;gap:10px;align-items:center;border-bottom:1px solid #2d3150;padding:14px 0}.task:last-child{border:0}.btn{background:#7767ff;color:white;border:0;border-radius:10px;padding:10px;cursor:pointer}.tabs{position:fixed;bottom:0;left:0;right:0;background:#171a31;display:flex;justify-content:center;gap:35px;padding:14px}.tab{cursor:pointer;color:#a9aecb}.active{color:#fff}.page{display:none}.page.active{display:block}</style><main class="app"><div class="top"><div class="logo">majix</div><div>👤 مجید</div></div><section id="home" class="page active"><div class="card"><div class="muted">موجودی توکن MJX</div><div class="balance" id="balance">0</div></div><h3>تسک‌های امروز</h3><div id="tasks" class="card"></div></section><section id="wallet" class="page"><h2>کیف پول</h2><div class="card"><div class="balance" id="balance2">0 MJX</div><p class="muted">پیش‌بینی فوتبال و قیمت MJX در نسخه بعدی اضافه می‌شود.</p></div></section><section id="profile" class="page"><h2>پروفایل</h2><div class="card">نام: مجید<br><br><button class="btn" onclick="alert('لینک دعوت آماده می‌شود')">دعوت از دوستان</button></div></section></main><nav class="tabs"><div class="tab active" onclick="nav('home',this)">خانه</div><div class="tab" onclick="nav('wallet',this)">کیف پول</div><div class="tab" onclick="nav('profile',this)">پروفایل</div></nav><script>let bal=0;async function load(){bal=(await fetch('/api/me').then(r=>r.json())).balance;render();let ts=await fetch('/api/tasks').then(r=>r.json());tasks.innerHTML=ts.map(t=>`<div class="task"><div style="flex:1"><b>${t.title}</b><div class="muted">${t.description}</div></div><button class="btn" onclick="complete(${t.id})">+${t.reward}</button></div>`).join('')}function render(){balance.textContent=bal;balance2.textContent=bal+' MJX'}async function complete(id){let r=await fetch('/api/tasks/'+id+'/complete',{method:'POST'}).then(r=>r.json());bal=r.balance;render();alert('تبریک! '+r.reward+' توکن گرفتی')}function nav(id,e){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.classList.add('active')}load()</script></html>

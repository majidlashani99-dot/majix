<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0E14" />
  <title>MJX</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0B0E14;
      --cyan: #00F2FE;
      --violet: #7F00FF;
      --text: #FFFFFF;
      --muted: #9AA3B2;
      --glass: rgba(18, 22, 33, 0.72);
      --line: rgba(255, 255, 255, 0.08);
      --magenta: #FF2E8B;
      --good: #3DFFB0;
      --danger: #FF4D6D;
      --gold: #D4AF37;
      --silver: #C0C7D1;
      --bronze: #C4845A;
      --radius: 24px;
      --nav-h: 78px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; }
    input {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      outline: none;
    }
    input:focus {
      border-color: rgba(0,242,254,0.45);
      box-shadow: 0 0 0 3px rgba(0,242,254,0.12);
    }
    .app {
      position: relative;
      width: min(430px, 100%);
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(900px 420px at 80% -10%, rgba(0,242,254,0.08), transparent 55%),
        radial-gradient(720px 360px at 0% 100%, rgba(127,0,255,0.07), transparent 50%),
        var(--bg);
    }
    .page {
      display: none;
      position: absolute;
      inset: 0 0 calc(var(--nav-h) + var(--safe-b)) 0;
      overflow: auto;
      padding: 18px 18px 28px;
      scrollbar-width: none;
    }
    .page::-webkit-scrollbar { display: none; }
    .page.active { display: block; animation: rise .22s ease; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .glass {
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .row, .between { display: flex; align-items: center; }
    .between { justify-content: space-between; }
    .gap12 { gap: 12px; }
    .mt8 { margin-top: 8px; }
    .mt12 { margin-top: 12px; }
    .mt16 { margin-top: 16px; }
    .mt20 { margin-top: 20px; }
    .mt24 { margin-top: 24px; }
    .display { font-family: Outfit, Inter, sans-serif; letter-spacing: -0.03em; }
    h1 { font-family: Outfit, Inter, sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
    h2 { font-size: 15px; font-weight: 600; }
    .muted { color: var(--muted); }
    .tiny { font-size: 12px; color: var(--muted); }
    .center { text-align: center; }
    .avatar {
      width: 42px; height: 42px; border-radius: 50%;
      display: grid; place-items: center;
      background: linear-gradient(180deg, rgba(0,242,254,0.18), rgba(127,0,255,0.16));
      border: 1px solid rgba(0,242,254,0.28);
      box-shadow: 0 0 0 3px rgba(0,242,254,0.08);
      font-family: Outfit, sans-serif; font-weight: 700;
    }
    .avatar.lg {
      width: 86px; height: 86px; font-size: 28px;
      box-shadow: 0 0 0 4px rgba(0,242,254,0.12), 0 0 32px rgba(0,242,254,0.18);
    }
    .badge {
      display: inline-flex; align-items: center;
      padding: 5px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
      background: rgba(127,0,255,0.16); color: #d8b6ff;
      border: 1px solid rgba(127,0,255,0.28);
    }
    .badge.cyan {
      background: rgba(0,242,254,0.1); color: var(--cyan);
      border-color: rgba(0,242,254,0.22);
    }
    .badge.good {
      background: rgba(61,255,176,0.1); color: var(--good);
      border-color: rgba(61,255,176,0.2);
    }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 14px;
      display: grid; place-items: center;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
    }
    .cta {
      width: 100%; height: 54px; border-radius: 18px;
      background: var(--cyan); color: #042026; font-weight: 700;
      box-shadow: 0 8px 28px rgba(0,242,254,0.28);
    }
    .cta.magenta {
      background: linear-gradient(180deg, #FF4DA0, var(--magenta));
      color: #fff; box-shadow: 0 8px 28px rgba(255,46,139,0.28);
    }
    .cta.ghost {
      background: transparent; color: var(--text);
      box-shadow: none; border: 1px solid var(--line);
    }
    .cta:disabled { opacity: 0.45; box-shadow: none; }
    .tile { flex: 1; padding: 16px; min-height: 108px; text-align: start; }
    .tile .ico {
      width: 36px; height: 36px; border-radius: 12px;
      display: grid; place-items: center; margin-bottom: 14px;
      background: rgba(0,242,254,0.08);
      border: 1px solid rgba(0,242,254,0.12);
    }
    .ring-wrap { width: 168px; height: 168px; margin: 10px auto 0; position: relative; }
    .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .task { display: flex; align-items: center; gap: 12px; padding: 14px; }
    .task .ico {
      width: 42px; height: 42px; border-radius: 14px; flex: 0 0 42px;
      display: grid; place-items: center;
      background: rgba(255,255,255,0.04); border: 1px solid var(--line);
    }
    .task .start {
      height: 36px; padding: 0 14px; border-radius: 12px;
      background: rgba(0,242,254,0.12); color: var(--cyan);
      font-weight: 700; font-size: 12px;
    }
    .task.done .start { background: rgba(61,255,176,0.1); color: var(--good); }
    .thumb {
      height: 176px; border-radius: 18px; position: relative; overflow: hidden;
      background:
        linear-gradient(180deg, rgba(11,14,20,0.1), rgba(11,14,20,0.72)),
        radial-gradient(circle at 70% 20%, rgba(0,242,254,0.18), transparent 40%),
        #121621;
    }
    .play {
      position: absolute; inset: 0; margin: auto;
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(0,242,254,0.92); color: #042026;
      display: grid; place-items: center;
      box-shadow: 0 10px 30px rgba(0,242,254,0.35);
    }
    .timer-abs { position: absolute; top: 12px; right: 12px; }
    .seg {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
      padding: 5px; border-radius: 16px;
    }
    .seg button { height: 38px; border-radius: 12px; color: var(--muted); font-weight: 600; }
    .seg button.on { background: rgba(0,242,254,0.12); color: var(--cyan); }
    .chips { display: flex; gap: 8px; overflow: auto; }
    .chip {
      flex: 0 0 auto; height: 34px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 600;
    }
    .chip.on {
      color: var(--cyan);
      border-color: rgba(0,242,254,0.35);
      background: rgba(0,242,254,0.08);
    }
    .chart-box { height: 188px; padding: 10px; }
    canvas { width: 100%; height: 100%; display: block; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .odds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .odd {
      padding: 12px 8px; border-radius: 16px; text-align: center;
      border: 1px solid var(--line); background: rgba(255,255,255,0.02);
    }
    .odd.on { border-color: rgba(0,242,254,0.5); box-shadow: 0 0 0 3px rgba(0,242,254,0.1); }
    .odd b { display: block; font-family: Outfit, sans-serif; font-size: 18px; }
    .odd span { font-size: 11px; color: var(--muted); }
    .tx, .list-row, .lb { display: flex; align-items: center; }
    .tx, .list-row { justify-content: space-between; padding: 14px 4px; }
    .tx + .tx, .list-row + .list-row { border-top: 1px solid var(--line); }
    .switch {
      width: 44px; height: 26px; border-radius: 999px;
      position: relative; background: rgba(255,255,255,0.1);
    }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s;
    }
    .switch.on { background: var(--cyan); }
    .switch.on::after { left: 21px; }
    .switch.off { opacity: 0.55; }
    .podium { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 8px; align-items: end; }
    .pod { padding: 16px 10px; text-align: center; }
    .pod.gold { min-height: 168px; }
    .lb { gap: 10px; padding: 11px 2px; }
    .pin {
      position: sticky; bottom: 0; margin-top: 10px; padding: 12px 14px;
      box-shadow: 0 -16px 24px rgba(11,14,20,0.55);
    }
    .nav {
      position: absolute; left: 12px; right: 12px;
      bottom: calc(10px + var(--safe-b));
      height: 64px; border-radius: 22px;
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px; z-index: 20;
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; color: var(--muted); font-size: 10px; font-weight: 600;
    }
    .tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
    .tab.on { color: var(--cyan); }
    .tab.on::after { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--cyan); }
    .toast {
      position: absolute; top: 14px; left: 18px; right: 18px; z-index: 40;
      display: none; padding: 12px 14px; color: #042026;
      background: var(--cyan); font-weight: 700; font-size: 13px;
    }
    .toast.show { display: block; animation: rise .2s ease; }
    .head { min-height: 42px; margin-bottom: 18px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { padding: 14px 10px; text-align: center; }
    .stat b { display: block; font-family: Outfit, sans-serif; font-size: 16px; margin-bottom: 4px; }
    .range { accent-color: var(--cyan); width: 100%; }
    .danger { color: var(--danger); font-weight: 600; }
    .gift {
      width: 92px; height: 92px; margin: 8px auto 16px; border-radius: 28px;
      display: grid; place-items: center;
      background: radial-gradient(circle at 50% 30%, rgba(0,242,254,0.22), rgba(127,0,255,0.08) 70%, transparent);
      box-shadow: 0 0 40px rgba(0,242,254,0.12);
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="toast glass" id="toast"></div>
    <section class="page active" id="page-home"></section>
    <section class="page" id="page-watch"></section>
    <section class="page" id="page-tasks"></section>
    <section class="page" id="page-trade"></section>
    <section class="page" id="page-wallet"></section>
    <section class="page" id="page-withdraw"></section>
    <section class="page" id="page-referral"></section>
    <section class="page" id="page-leaderboard"></section>
    <section class="page" id="page-profile"></section>
    <section class="page" id="page-settings"></section>
    <nav class="nav glass" id="bottomNav"></nav>
  </div>
  <script>
    const RATE = 0.001;
    const MIN_WD = 1000;
    const I18N = {
      en: {
        home: "Home", tasks: "Tasks", trade: "Trade", wallet: "Wallet", profile: "Profile",
        vip: "VIP Trader", goal: "Withdrawal Goal", goalReached: "Goal reached",
        watchEarn: "Watch & Earn", majixBet: "MajixBet Trading",
        dailyVideos: "Daily videos", remaining: "remaining", each: "+1 $MJX each",
        claim: "Claim +1 $MJX", claimed: "+1 $MJX Claimed",
        completeTasks: "Complete Tasks & Earn", start: "Start", done: "Done",
        joinTg: "Join Telegram", followX: "Follow X / Twitter", invite3: "Invite 3 Friends",
        call: "CALL / LONG", put: "PUT / SHORT", stake: "Stake amount",
        sports: "Sports", trading: "Trading", placeBet: "Place Bet",
        deposit: "Deposit", withdraw: "Withdraw", available: "Available", min: "Min",
        confirmWd: "Confirm & Withdraw", inviteHero: "Invite Friends, Earn 10% Lifetime",
        copy: "Copy", invites: "Invites", earned: "Earned", videos: "Videos",
        winRate: "Win Rate", goldTier: "Gold Tier", security: "Account Security",
        linked: "Linked Wallet", kyc: "KYC Verified", settings: "Settings",
        dark: "Dark Mode", push: "Push Notifications", twofa: "2FA Security",
        sound: "Sound", language: "Language", disconnect: "Disconnect Wallet",
        paste: "Paste", address: "TON Wallet Address", amount: "Amount",
        recent: "Recent activity", leaderboard: "Leaderboard", referral: "Referral"
      },
      fa: {
        home: "خانه", tasks: "تسک‌ها", trade: "معامله", wallet: "کیف پول", profile: "پروفایل",
        vip: "معامله‌گر VIP", goal: "هدف برداشت", goalReached: "هدف تکمیل شد",
        watchEarn: "تماشا و کسب درآمد", majixBet: "معاملات MajixBet",
        dailyVideos: "ویدیوهای روزانه", remaining: "باقی‌مانده", each: "هر کدام ۱+ $MJX",
        claim: "دریافت ۱+ $MJX", claimed: "۱+ $MJX دریافت شد",
        completeTasks: "تسک‌ها را کامل کنید و پاداش بگیرید", start: "شروع", done: "انجام شد",
        joinTg: "عضویت در تلگرام", followX: "دنبال کردن X / توییتر", invite3: "دعوت ۳ دوست",
        call: "کال / لانگ", put: "پوت / شورت", stake: "مبلغ استیک",
        sports: "ورزشی", trading: "معامله", placeBet: "ثبت شرط",
        deposit: "واریز", withdraw: "برداشت", available: "موجود", min: "حداقل",
        confirmWd: "تأیید و برداشت", inviteHero: "دوستانت را دعوت کن، ۱۰٪ مادام‌العمر بگیر",
        copy: "کپی", invites: "دعوت", earned: "درآمد", videos: "ویدیو",
        winRate: "نرخ برد", goldTier: "سطح طلایی", security: "امنیت حساب",
        linked: "کیف پول متصل", kyc: "احراز هویت شده", settings: "تنظیمات",
        dark: "حالت تیره", push: "اعلان‌ها", twofa: "امنیت ۲ مرحله‌ای",
        sound: "صدا", language: "زبان", disconnect: "قطع کیف پول",
        paste: "چسباندن", address: "آدرس کیف پول TON", amount: "مبلغ",
        recent: "فعالیت اخیر", leaderboard: "رتبه‌بندی", referral: "معرفی"
      }
    };

    const state = {
      lang: "en", name: "Majid", balance: 5870, page: "home", tab: "home",
      tradePanel: "trade", multiplier: 5, pair: 92450, odd: 1.85, sport: "ucl",
      sportStake: 50, network: "TON", videosLeft: 3, watching: false, canClaim: false,
      tLeft: 30, timer: null, tasks: { tg: false, x: false, invite: false },
      notify: true, twofa: true, sound: false,
      txs: [
        { t: "Video", v: 1, s: "cyan" },
        { t: "Trade Profit", v: 50, s: "good" },
        { t: "Referral", v: 10, s: "cyan" }
      ]
    };

    const $ = (id) => document.getElementById(id);
    const tr = (k) => I18N[state.lang][k] || k;
    const fmt = (n) => n.toLocaleString("en-US");
    const usd = (n) => (n * RATE).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function haptic(type = "light") {
      const h = window.Telegram?.WebApp?.HapticFeedback;
      if (!h) return;
      type === "success" ? h.notificationOccurred("success") : h.impactOccurred(type);
    }
    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2200);
    }
    function icon(name) {
      const icons = {
        back: '<polyline points="15 18 9 12 15 6"/>',
        play: '<polygon points="10 8 16 12 10 16" fill="currentColor" stroke="none"/>',
        eye: '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.2"/>',
        chart: '<path d="M4 19V8"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M20 19V3"/>',
        gift: '<rect x="4" y="9" width="16" height="11" rx="2"/><path d="M4 13h16"/><path d="M12 9v11"/><path d="M12 9c0-3-2-5-4-3s0 4 4 3"/><path d="M12 9c0-3 2-5 4-3s0 4-4 3"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7.5" r="3"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a3 3 0 0 1 0 5.75"/>',
        wallet: '<rect x="3" y="7" width="18" height="12" rx="3"/><path d="M16 13h4"/><path d="M3 10h18"/>',
        user: '<circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.4-3 4-4.5 7-4.5S17.6 16 19 19"/>',
        home: '<path d="M4 11.5 12 5l8 6.5"/><path d="M7 10.5V19h10v-8.5"/>',
        tasks: '<rect x="5" y="4" width="14" height="16" rx="3"/><path d="M8 9h8"/><path d="M8 13h5"/>',
        tg: '<path d="M21 5 3 11.5l6 2L17 8l-6 8 7 2L21 5z"/>',
        x: '<path d="M6 6l12 12"/><path d="M18 6 6 18"/>'
      };
      return `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${icons[name] || ""}</svg>`;
    }
    function backBtn(to, tab) {
      return `<button class="icon-btn" onclick="go('${to}','${tab || to}')">${icon("back")}</button>`;
    }
    function ring(pct) {
      const r = 62, c = 2 * Math.PI * r, off = c * (1 - pct);
      return `<svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="10"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="#00F2FE" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
    }

    function renderHome() {
      const reached = state.balance >= MIN_WD;
      const pct = Math.min(state.balance, MIN_WD) / MIN_WD;
      $("page-home").innerHTML = `
        <div class="head between">
          <div class="row gap12">
            <div class="avatar">${state.name[0]}</div>
            <div>
              <div class="display" style="font-weight:700">${state.name}</div>
              <button class="badge" onclick="go('leaderboard','profile')">${tr("vip")}</button>
            </div>
          </div>
          <button class="icon-btn" onclick="go('settings','profile')">${icon("user")}</button>
        </div>
        <div class="center mt16">
          <div class="tiny">$MJX</div>
          <div class="display" style="font-size:42px;font-weight:800;line-height:1.1">${fmt(state.balance)} $MJX</div>
          <div class="muted mt8">= $${usd(state.balance)}</div>
        </div>
        <div class="ring-wrap">
          ${ring(pct)}
          <div class="ring-center">
            <div class="tiny">${reached ? tr("goalReached") : tr("goal")}</div>
            <b class="display">${fmt(Math.min(state.balance, MIN_WD))} / ${fmt(MIN_WD)}</b>
            <div class="tiny">$MJX</div>
          </div>
        </div>
        <div class="row gap12 mt24">
          <button class="glass tile" onclick="go('watch','home')">
            <div class="ico">${icon("eye")}</div>
            <b>${tr("watchEarn")}</b>
            <div class="tiny mt8">${state.videosLeft}/5 ${tr("remaining")}</div>
          </button>
          <button class="glass tile" onclick="go('trade','trade')">
            <div class="ico">${icon("chart")}</div>
            <b>${tr("majixBet")}</b>
            <div class="tiny mt8">BTC · Sports</div>
          </button>
        </div>`;
    }

    function renderWatch() {
      const done = 5 - state.videosLeft;
      const completed = Array.from({ length: done }, (_, i) => `
        <div class="list-row">
          <div><div>Brief #${i + 1}</div><div class="tiny">30s</div></div>
          <span class="badge cyan">${tr("claimed")}</span>
        </div>`).join("");
      $("page-watch").innerHTML = `
        <div class="head between">
          ${backBtn("home", "home")}
          <div class="center">
            <h2>${tr("watchEarn")}</h2>
            <div class="tiny">${tr("dailyVideos")} ${state.videosLeft}/5 ${tr("remaining")} · ${tr("each")}</div>
          </div>
          <div style="width:40px"></div>
        </div>
        <div class="glass" style="padding:14px">
          <div class="thumb">
            <div class="timer-abs badge cyan" id="timerText">${state.tLeft}s</div>
            <button class="play" id="playBtn" onclick="playVideo()">${icon("play")}</button>
          </div>
          <button class="cta mt16" ${state.canClaim ? "" : "disabled"} onclick="claimVideo()">${tr("claim")}</button>
        </div>
        <div class="glass mt16" style="padding:8px 14px">

    function renderSettings() {
      const row = (label, ctrl) => `<div class="list-row"><span>${label}</span>${ctrl}</div>`;

          ${row(tr("twofa"), `<button class="switch ${state.twofa ? "on" : ""}" onclick="state.twofa=!state.twofa;renderSettings()"></button>`)}
          ${row(tr("sound"), `<button class="switch ${state.sound ? "on" : ""}" onclick="state.sound=!state.sound;renderSettings()"></button>`)}
          ${row(tr("language"), `<button class="badge cyan" onclick="toggleLang()">${state.lang === "en" ? "English" : "فارسی"}</button>`)}
        </div>
        <div class="center mt24 tiny">MJX v2.4.0</div>

    }

    function renderNav() {
      const tabs = [
        ["home", "home", "home"],
        ["tasks", "tasks", "tasks"],
        ["trade", "trade", "chart"],
        ["wallet", "wallet", "wallet"],
        ["profile", "profile", "user"]
      ];
      $("bottomNav").innerHTML = tabs.map(([id, key, ic]) =>
        `<button class="tab ${state.tab === id ? "on" : ""}" onclick="go('${id}','${id}')">${icon(ic)}<span>${tr(key)}</span></button>`
      ).join("");
    }

    const pages = {
      home: renderHome, watch: renderWatch, tasks: renderTasks, trade: renderTrade,
      wallet: renderWallet, withdraw: renderWithdraw, referral: renderReferral,
      leaderboard: renderLeaderboard, profile: renderProfile, settings: renderSettings
    };

    function go(page, tab) {
      state.page = page;
      if (tab) state.tab = tab;
      document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
      $("page-" + page).classList.add("active");
      pages[page]();
      renderNav();
      haptic("light");
    }
    function setPanel(p) { state.tradePanel = p; renderTrade(); }
    function setMult(n) { state.multiplier = n; renderTrade(); }

    function playVideo() {
      if (state.videosLeft <= 0 || state.watching) return;
      state.watching = true;
      state.canClaim = false;
      state.tLeft = 30;
      haptic("medium");
      state.timer = setInterval(() => {
        state.tLeft -= 1;
        const el = $("timerText");
        if (el) el.textContent = state.tLeft + "s";
        if (state.tLeft <= 0) {
          clearInterval(state.timer);
          state.watching = false;
          state.canClaim = true;
          renderWatch();
        }
      }, 1000);
      if ($("playBtn")) $("playBtn").style.opacity = "0.35";
    }
    function claimVideo() {
      if (!state.canClaim) return;
      state.canClaim = false;
      state.videosLeft = Math.max(0, state.videosLeft - 1);
      state.balance += 1;
      state.txs.unshift({ t: "Video", v: 1, s: "cyan" });
      haptic("success");
      toast("+1 $MJX");
      renderWatch();
    }
    function doTask(id, reward) {
      if (id === "invite") { go("referral", "profile"); return; }
      if (state.tasks[id]) return;
      state.tasks[id] = true;
      state.balance += reward;
      state.txs.unshift({ t: "Task", v: reward, s: "cyan" });
      haptic("success");
      toast("+" + reward + " $MJX");
      renderTasks();
    }
    function placeTrade(side) {
      const stake = Math.max(1, Number($("stakeInput")?.value || 50));
      if (stake > state.balance) return toast("Insufficient $MJX");
      const win = Math.random() > 0.45;
      const delta = Math.round(stake * (win ? state.multiplier * 0.8 : -1));
      state.balance = Math.max(0, state.balance + delta);
      state.txs.unshift({ t: win ? "Trade Profit" : "Trade Loss", v: Math.abs(delta), s: win ? "good" : "cyan" });
      haptic(win ? "success" : "medium");
      toast((delta >= 0 ? "+" : "-") + Math.abs(delta) + " $MJX · " + side.toUpperCase());
    }
    function placeBet() {
      if (state.sportStake > state.balance) return toast("Insufficient $MJX");
      const win = Math.random() > 0.5;
      const delta = Math.round(state.sportStake * (win ? state.odd - 1 : -1));
      state.balance = Math.max(0, state.balance + delta);
      const box = $("sportResult");
      if (box) box.textContent = (win ? "Won " : "Lost ") + Math.abs(delta) + " $MJX";
      haptic(win ? "success" : "medium");
    }
    async function pasteAddr() {
      try {
        const txt = await navigator.clipboard.readText();
        $("wdAddress").value = txt || "EQCmajiddemoaddress000000000000000";
      } catch {
        $("wdAddress").value = "EQCmajiddemoaddress000000000000000";
      }
    }
    function confirmWithdraw() {
      const amt = Number($("wdAmount")?.value || 0);
      if (amt < MIN_WD) return toast("Min " + MIN_WD + " $MJX");
      if (amt > state.balance) return toast("Insufficient $MJX");
      state.balance -= amt;
      haptic("success");
      toast("Withdrawal submitted");
      go("wallet", "wallet");
    }
    function copyRef() {
      navigator.clipboard?.writeText("https://t.me/MJX_Bot?start=ref_majid");
      haptic("success");
      toast("Link copied");
    }
    function toggleLang() {
      state.lang = state.lang === "en" ? "fa" : "en";
      document.documentElement.lang = state.lang === "fa" ? "fa" : "en";
      document.documentElement.dir = state.lang === "fa" ? "rtl" : "ltr";
      pages[state.page]();
      renderNav();
    }
    function drawChart() {
      const c = $("chartCanvas");
      if (!c) return;
      const dpr = window.devicePixelRatio || 1;
      const w = c.clientWidth, h = c.clientHeight;
      c.width = w * dpr; c.height = h * dpr;
      const ctx = c.getContext("2d");
      ctx.scale(dpr, dpr);
      let p = 100;
      const candles = Array.from({ length: 28 }, () => {
        const o = p, cl = p + (Math.random() - 0.48) * 16;
        const hi = Math.max(o, cl) + Math.random() * 6;
        const lo = Math.min(o, cl) - Math.random() * 6;
        p = cl;
        return { o, cl, hi, lo };
      });
      const min = Math.min(...candles.map((x) => x.lo)) - 4;
      const max = Math.max(...candles.map((x) => x.hi)) + 4;
      const y = (v) => ((max - v) / (max - min)) * (h - 16) + 8;
      const gap = w / candles.length;
      candles.forEach((k, i) => {
        const x = i * gap + gap * 0.5;
        const up = k.cl >= k.o;
        ctx.strokeStyle = up ? "#00F2FE" : "#7F00FF";
        ctx.fillStyle = up ? "rgba(0,242,254,.85)" : "rgba(127,0,255,.85)";
        ctx.beginPath(); ctx.moveTo(x, y(k.hi)); ctx.lineTo(x, y(k.lo)); ctx.stroke();
        const top = y(Math.max(k.o, k.cl)), bot = y(Math.min(k.o, k.cl));
        ctx.fillRect(x - 3.2, top, 6.4, Math.max(2, bot - top));
      });
      ctx.strokeStyle = "rgba(0,242,254,.45)";
      ctx.beginPath();
      candles.forEach((k, i) => {
        const x = i * gap + gap * 0.5;
        i ? ctx.lineTo(x, y((k.o + k.cl) / 2)) : ctx.moveTo(x, y((k.o + k.cl) / 2));
      });
      ctx.stroke();
      ctx.strokeStyle = "rgba(127,0,255,.4)";
      ctx.beginPath();
      candles.forEach((k, i) => {
        const x = i * gap + gap * 0.5;
        const v = y(k.cl - 6);
        i ? ctx.lineTo(x, v) : ctx.moveTo(x, v);
      });
      ctx.stroke();
    }

    async function hydrate() {
      try {
        const me = await fetch("/api/me").then((r) => r.ok ? r.json() : null);
        if (me?.balance != null) state.balance = Number(me.balance);
        if (me?.name) state.name = me.name;
      } catch {}
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        tg.setHeaderColor?.("#0B0E14");
        tg.setBackgroundColor?.("#0B0E14");
        const u = tg.initDataUnsafe?.user;
        if (u?.first_name) state.name = u.first_name;
      }
      go("home", "home");
    }

    window.go = go;
    window.setPanel = setPanel;
    window.setMult = setMult;
    window.playVideo = playVideo;
    window.claimVideo = claimVideo;
    window.doTask = doTask;
    window.placeTrade = placeTrade;
    window.placeBet = placeBet;
    window.pasteAddr = pasteAddr;
    window.confirmWithdraw = confirmWithdraw;
    window.copyRef = copyRef;
    window.toggleLang = toggleLang;
    window.renderTrade = renderTrade;
    window.renderSettings = renderSettings;
    hydrate();
  </script>
